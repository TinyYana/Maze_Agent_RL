name: Build MazeGame.exe

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Generate version number
        id: version
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $stamp = Get-Date -AsUTC -Format "yyyy.MM.dd.HHmm"
          $version = "v$stamp-$shortSha"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=mazegame-$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MazeGame.exe
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name MazeGame `
            --add-data "maze_master_ppo.zip;." `
            main.py
          Copy-Item dist\MazeGame.exe "dist\MazeGame-${{ steps.version.outputs.version }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MazeGame-${{ steps.version.outputs.version }}
          path: dist/MazeGame-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MazeGame ${{ steps.version.outputs.version }}
          files: dist/MazeGame-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
